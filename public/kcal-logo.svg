<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="kcalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b2e"/>
      <stop offset="100%" stop-color="#0d0b14"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="kcalShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Dark Purple Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#kcalBg)" filter="url(#kcalShadow)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="25.5" fill="none" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Energy Ring -->
  <circle cx="64" cy="52" r="34" fill="#13111c" stroke="url(#flameGrad)" stroke-width="3" filter="url(#kcalShadow)"/>

  <!-- Calorie Flame / Energy Icon -->
  <path d="M64 24 C64 34 52 38 52 50 C52 64 76 66 76 52 C76 46 72 40 70 36 C76 42 80 48 80 56 C80 68 68 76 58 74 C48 72 44 60 46 50 C48 40 60 30 64 24 Z" fill="url(#flameGrad)"/>
  <path d="M64 48 C64 54 58 56 58 62 C58 68 70 70 70 62 C70 58 68 54 66 52 Z" fill="#fef08a"/>

  <!-- KCAL Ribbon Badge -->
  <rect x="22" y="94" width="84" height="20" rx="10" fill="url(#flameGrad)" filter="url(#kcalShadow)"/>
  <text x="64" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#1e1b2e" text-anchor="middle" letter-spacing="1.5">CALOTRACK</text>
</svg>
