<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var storedScheme = localStorage.getItem("color-scheme");
        var metaScheme = document.querySelector('meta[name="color-scheme"]');
        if (metaScheme) metaScheme.content = storedScheme || "light dark";
        var isDark =
          storedScheme === "dark" ||
          (!storedScheme && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);
      } catch (e) {}
    </script>
    <title>CaloTrack</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CaloTrack" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Android / Chrome -->
    <meta name="theme-color" content="#f97316" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Pré-établit les connexions TCP+TLS -->
    <link rel="preconnect" href="https://fr.openfoodfacts.org" />
    <link rel="dns-prefetch" href="https://fr.openfoodfacts.org" />
    <link rel="preconnect" href="https://search.openfoodfacts.org" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
